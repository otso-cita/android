plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'com.looker.a11y'
    compileSdk 34
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'com.looker.a11y'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '1.0'
        // whisper.cpp native lib is arm64-only (built with armv8.2 fp16).
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path 'cpp/CMakeLists.txt'
        }
    }

    // Reuse the existing flat source layout instead of the Gradle default.
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }

    // The debug keystore is a local artifact (not shipped with the sources);
    // generate it on first build.
    def debugKeystore = file('debug.keystore')
    if (!debugKeystore.exists()) {
        exec {
            commandLine 'keytool', '-genkeypair', '-keystore', debugKeystore.absolutePath,
                    '-storepass', 'android', '-keypass', 'android',
                    '-alias', 'androiddebugkey', '-keyalg', 'RSA', '-keysize', '2048',
                    '-validity', '10000', '-dname', 'CN=Looker Debug,O=Looker,C=US'
        }
    }

    signingConfigs {
        debug {
            storeFile debugKeystore
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Shizuku client (vendored jars) for privileged airplane-mode toggling.
    implementation files('libs/shizuku-api.jar', 'libs/shizuku-provider.jar', 'libs/shizuku-aidl.jar')
}
